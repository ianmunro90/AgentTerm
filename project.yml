name: AgentTerm
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Team and bundle-identifier prefix: Config/AgentTerm.xcconfig (and your Local.xcconfig).
configFiles:
  Debug: Config/AgentTerm.xcconfig
  Release: Config/AgentTerm.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh.git
    minVersion: 0.3.4
    maxVersion: 0.4.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.7.3

targets:
  AgentTerm:
    type: application
    platform: iOS
    sources:
      - AgentTerm
    entitlements:
      path: AgentTerm/AgentTerm.entitlements
      properties:
        com.apple.security.application-groups: [group.$(AGENTTERM_BUNDLE_PREFIX).agentterm]
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-markdown
        product: Markdown
      - target: AgentTermShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTTERM_BUNDLE_PREFIX).agentterm
        INFOPLIST_KEY_NSFaceIDUsageDescription: AgentTerm uses Face ID to unlock your terminals.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentTerm
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: AgentTerm connects over SSH and mosh to computers on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  AgentTermShare:
    type: app-extension
    platform: iOS
    sources:
      - AgentTermShare
      - AgentTerm/Shared
      - AgentTerm/App/HostStore.swift
      - AgentTerm/SSH/KnownHosts.swift
      - AgentTerm/SSH/KeyManager.swift
    entitlements:
      path: AgentTermShare/AgentTermShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(AGENTTERM_BUNDLE_PREFIX).agentterm]
    dependencies:
      - package: Citadel
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
    info:
      path: AgentTermShare/Info.plist
      properties:
        CFBundleDisplayName: AgentTerm
        NSFaceIDUsageDescription: AgentTerm uses Face ID before uploading to your hosts.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTTERM_BUNDLE_PREFIX).agentterm.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
